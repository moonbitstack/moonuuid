  <!-- wordmark -->
  <text x="155" y="102" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif" font-size="52" font-weight="700" letter-spacing="-1.4" fill="#26221b">moonuuid</text>

  <!-- tagline -->
