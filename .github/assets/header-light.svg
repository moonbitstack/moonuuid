  <!-- the identifier, one colour per field -->
  <text x="844" y="145" text-anchor="end" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" letter-spacing="0.2"><tspan fill="#2b4c96">c232ab00</tspan><tspan fill="#867c68">-</tspan><tspan fill="#b4562f">9414</tspan><tspan fill="#867c68">-</tspan><tspan fill="#9a7412">11ec</tspan><tspan fill="#867c68">-</tspan><tspan fill="#2f7d6d">b3c8</tspan><tspan fill="#867c68">-</tspan><tspan fill="#7a4a86">9f6bdeced846</tspan></text>

