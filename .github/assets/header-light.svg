  <circle cx="104" cy="95" r="30" fill="none" stroke="#23458f" stroke-width="1.3" opacity="0.85"/>
  <circle cx="104" cy="95" r="24.5" fill="none" stroke="#23458f" stroke-width="0.7" opacity="0.4"/>
  <text x="104" y="94" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="700" letter-spacing="0.4" fill="#23458f">128</text>
  <text x="104" y="105.5" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="7" letter-spacing="1.8" fill="#23458f" opacity="0.9">BIT</text>

