  <title id="t">moonuuid</title>
  <desc id="d">Letterhead: moonuuid, a MoonBit library for RFC 9562 identifiers.</desc>

  <rect width="900" height="190" rx="14" fill="#fbf6ea"/>
  <rect x="0.6" y="0.6" width="898.8" height="188.8" rx="13.4" fill="none" stroke="#e3d8bd" stroke-width="1.2"/>

  <!-- margin rule -->
